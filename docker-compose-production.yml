services:
  clipper_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clipper_app
    restart: unless-stopped
    # This is the "Spring Profile" logic:
    env_file:
      - .env.${APP_PROFILE:-local}
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/node_modules
    depends_on:
      clipper_postgres:
        condition: service_healthy
      clipper_storage:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 1024M
    entrypoint: [ "/bin/sh", "/var/www/html/start.sh" ]

  clipper_tunnel:
    image: cloudflare/cloudflared:latest
    container_name: clipper_tunnel
    restart: unless-stopped
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run

  clipper_postgres:
    image: postgres:17-alpine
    container_name: clipper_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_DATABASE:-clipper_ms}
    volumes:
      - clipper_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-clipper_ms}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  clipper_storage:
    image: minio/minio
    container_name: clipper_storage
    restart: always
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
      MINIO_BROWSER: "off"
      MINIO_BROWSER_REDIRECT: "false"
    volumes:
      - clipper_minio_data:/data
    command: server /data
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  clipper_db_data:
    external: true
  clipper_minio_data:
    external: true
