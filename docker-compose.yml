services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clipper_app
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/node_modules
    depends_on:
      clipper_postgres:
        condition: service_healthy
      clipper_storage:
        condition: service_started
    environment:
      - APP_ENV=local
      - APP_KEY=base64:SxBKcBddwAwlbeJbHNq8BH7FgQNvUl41eod+Hk8yOow=
      - DB_CONNECTION=pgsql
      - DB_HOST=clipper_postgres
      - DB_PORT=5432
      - DB_DATABASE=clipper-postgres
      - DB_USERNAME=postgres
      - DB_PASSWORD=password
      - FILESYSTEM_DISK=s3
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_BUCKET=clipper-ms
      # Internal Docker communication
      - AWS_ENDPOINT=http://clipper_storage:9000
      # External URL for your browser/Vue to see images
      - AWS_URL=http://localhost:9000/clipper-ms
      - AWS_USE_PATH_STYLE_ENDPOINT=true
    command: >
      sh -c "composer install && 
             php artisan config:clear && 
             apache2-foreground"

  db:
    image: postgres:17
    container_name: clipper_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_DATABASE:-clipper-postgres}
    ports:
      - "${FORWARD_DB_PORT:-5432}:5432"
    volumes:
      - ./docker/db_data:/var/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-clipper-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

s3:
    image: minio/minio
    container_name: clipper_storage
    # Explicitly kill the default entrypoint
    entrypoint: ["/bin/sh", "-c"]
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    volumes:
      - ./docker/minio_data:/data
    restart: always
    # The command now starts directly with the logic
    command: >
      "minio server /data --console-address ':9001' &
      sleep 5;
      mc alias set local http://localhost:9000 admin password;
      mc mb --ignore-existing local/clipper-ms;
      mc anonymous set download local/clipper-ms;
      wait"

# public config for bucket
# docker exec clipper_storage //bin/sh -c "mc alias set temp http://localhost:9000 admin password && mc anonymous set download temp/clipper-ms"
